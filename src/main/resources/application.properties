# Valores locales (contraseñas, clave JWT) en config/local.properties, fuera de Git. Las variables de entorno
# (por ejemplo las de Elastic Beanstalk) siempre tienen prioridad sobre este archivo y sobre el local.
spring.config.import=optional:file:./config/local.properties

spring.application.name=agrocrew-backend
server.port=${PORT:8080}

# ---------- Base de datos (PostgreSQL) ----------
# En local usa los valores por defecto; en AWS se definen como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrocrew_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Lima

# ---------- Seguridad / JWT ----------
# La clave por defecto es SOLO para desarrollo. En AWS definir JWT_SECRET (Base64, minimo 256 bits).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Orígenes que siempre se aceptan (la app en Netlify con su nombre antiguo y el nuevo, y la landing), más los de
# CORS_ORIGINS si se define en Elastic Beanstalk. Así renombrar el sitio de Netlify no rompe el login.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173},https://lucent-kataifi-1dfa95.netlify.app,https://agrocrewweb.netlify.app,https://agrocrew.netlify.app

# Usuario administrador inicial (se crea solo si ambas variables tienen valor)
app.admin.email=${ADMIN_EMAIL:admin@agrocrew.pe}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Logs ----------
logging.level.pe.edu.upc.agrocrew=DEBUG
logging.file.name=logs/agrocrew.log

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- Integraciones externas ----------
app.integraciones.timeout-segundos=15
app.integraciones.open-meteo.archivo-url=https://archive-api.open-meteo.com/v1/archive
app.integraciones.open-meteo.pronostico-url=https://api.open-meteo.com/v1/forecast
# Capa ArcGIS con la Capacidad de Uso Mayor (datos del MIDAGRI publicados en el visor OCAPAS del SERFOR).
# Campos: GRUPOCUM, SIMCUM (símbolo, ej. A2s), DESCUM. Se pueden poner varias capas separadas por coma.
app.integraciones.midagri.capas-cum=https://geo.serfor.gob.pe/geoservicios/rest/services/Visor/OCAPAS_MIDAGRI/MapServer/42,https://geo.serfor.gob.pe/geoservicios/rest/services/Visor/OCAPAS_MIDAGRI/MapServer/32
# Capa de Puntos Críticos de la ANA ("Público" va codificado como P%C3%BAblico)
app.integraciones.ana.capa-puntos-criticos=https://geosnirh.ana.gob.pe/server/rest/services/P%C3%BAblico/PuntosCriticos/MapServer/125
app.integraciones.ana.cron-sincronizacion=0 0 3 * * *

# ---------- Riesgo y alertas ----------
app.riesgo.radio-km=5
app.alertas.umbral-lluvia-mm=30
app.alertas.cron-lluvias=0 0 6 * * *

# ---------- Inteligencia artificial (explicación de la evaluación) ----------
# Google Gemini. Sin IA_API_KEY la IA queda desactivada y se usa la explicación con plantilla.
app.ia.api-key=${IA_API_KEY:}
app.ia.modelo=${IA_MODELO:gemini-2.5-flash}
app.ia.url=https://generativelanguage.googleapis.com/v1beta/models

# ---------- Sprint 3: catastro rural (US07) ----------
# Servicio ArcGIS del MIDAGRI (visor OCAPAS del SERFOR) con las capas "Predios Rurales - <Departamento>".
# Campos usados: UNICAT (código catastral), NOMPRE, UBIDIS (ubigeo del distrito) y el área en hectáreas.
app.integraciones.catastro.servicio-url=https://geo.serfor.gob.pe/geoservicios/rest/services/Visor/OCAPAS_MIDAGRI/MapServer

# ---------- Sprint 3: recuperación de contraseña (US05) ----------
# URL del frontend para armar el enlace del correo (la ruta /restablecer la atiende Angular).
app.front.url=${FRONT_URL:http://localhost:4200}
app.recuperacion.minutos-validez=30
app.correo.remitente=${MAIL_FROM:no-reply@agrocrew.pe}
# El correo solo se envía si se define SPRING_MAIL_HOST (y SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD). Sin esas variables, el enlace se escribe en el log (útil en local).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
