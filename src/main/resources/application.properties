spring.application.name=agrocrew-backend
server.port=${PORT:8080}

# ---------- Base de datos (PostgreSQL) ----------
# En local usa los valores por defecto; en AWS se definen como variables de entorno.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrocrew_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.time-zone=America/Lima

# ---------- Seguridad / JWT ----------
# La clave por defecto es SOLO para desarrollo. En AWS definir JWT_SECRET (Base64, minimo 256 bits).
app.jwt.secret=${JWT_SECRET:baWsiEQIhvXCXwbr/scxQQlhIbtK59+zK42ZJN84wNfUIpU4+MjjvcaSuzb0oPFD}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:5173}

# Usuario administrador inicial (se crea solo si ambas variables tienen valor)
app.admin.email=${ADMIN_EMAIL:admin@agrocrew.pe}
app.admin.password=${ADMIN_PASSWORD:Admin12345}

# ---------- Logs ----------
logging.level.pe.edu.upc.agrocrew=DEBUG
logging.file.name=logs/agrocrew.log

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ---------- Integraciones externas ----------
app.integraciones.timeout-segundos=15
app.integraciones.open-meteo.archivo-url=https://archive-api.open-meteo.com/v1/archive
app.integraciones.open-meteo.pronostico-url=https://api.open-meteo.com/v1/forecast
# Capa ArcGIS con la Capacidad de Uso Mayor (datos del MIDAGRI publicados en el visor OCAPAS del SERFOR).
# Campos: GRUPOCUM, SIMCUM (símbolo, ej. A2s), DESCUM. Se pueden poner varias capas separadas por coma.
app.integraciones.midagri.capas-cum=https://geo.serfor.gob.pe/geoservicios/rest/services/Visor/OCAPAS_MIDAGRI/MapServer/42
# Capa de Puntos Críticos de la ANA ("Público" va codificado como P%C3%BAblico)
app.integraciones.ana.capa-puntos-criticos=https://geosnirh.ana.gob.pe/server/rest/services/P%C3%BAblico/PuntosCriticos/MapServer/125
app.integraciones.ana.cron-sincronizacion=0 0 3 * * *

# ---------- Riesgo y alertas ----------
app.riesgo.radio-km=5
app.alertas.umbral-lluvia-mm=30
app.alertas.cron-lluvias=0 0 6 * * *
